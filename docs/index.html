<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Onezipp team dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Onezipp team dashboard</h1>
  <p class="meta">Data generated: <span id="generated">-</span> · sanitized export (no amounts, IDs or names beyond agents)</p>
</header>
<main class="grid">
  <section class="tile" id="tile-owner-status"><h2>Tasks by owner and status</h2><div class="body"></div></section>
  <section class="tile" id="tile-deadlines"><h2>Upcoming deadlines (next 14 days)</h2><div class="body"></div></section>
  <section class="tile" id="tile-pipeline"><h2>Pipeline by stage</h2><div class="body"></div></section>
  <section class="tile" id="tile-unknowns"><h2>Open unknowns</h2><div class="body"></div></section>
  <section class="tile" id="tile-next"><h2>Next steps per agent</h2><div class="body"></div></section>
  <section class="tile wide" id="tile-decisions"><h2>Decisions</h2><div class="body"></div></section>
  <section class="tile wide" id="tile-tasks"><h2>All tasks</h2><div class="body"></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
